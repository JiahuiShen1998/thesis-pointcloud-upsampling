# Line B main baseline: native 512 points, no loader resample/pad
# Compare upsampling branch (1024 pts) against this baseline within Line B.

experiment_name: downsampled50_native512_pointnet2
line: B
branch: baseline

data_root: datasets/modelnet40_downsampled50
native_points: 512
num_point: 512
allow_resample: false

model: pointnet2_cls_ssg
num_category: 40
use_normals: false

training:
  epoch: 200
  batch_size: 24
  learning_rate: 0.001
  decay_rate: 0.0001
  optimizer: Adam
  scheduler_step: 20
  scheduler_gamma: 0.7
  seed: 42
  num_workers: 4

output_dir: outputs/downsampled50_native512_pointnet2
log_dir: logs/downsampled50_native512_pointnet2
reports_dir: reports/downsampled50_native512_pointnet2

module: python/pytorch2.6py3.12
pip_packages:
  - tqdm

# Ablation only (NOT main baseline):
#   downsampled50_baseline: disk 512, loader resample 512→1024, num_point=1024
