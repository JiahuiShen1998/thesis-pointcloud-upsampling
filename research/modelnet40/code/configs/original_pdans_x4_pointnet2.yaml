# Line A main upsampling: Original + PDANS ×4 → PointNet++
# Native 4096 points from 1024→4096 upsampling; no loader resample.

experiment_name: original_pdans_x4_pointnet2
line: A
branch: upsampling
upsampling_method: PDANS
upsampling_factor: 4

data_root: datasets/modelnet40_original_up/pdans_x4
native_points: 4096
num_point: 4096
allow_resample: false

model: pointnet2_cls_ssg
num_category: 40
use_normals: false

training:
  epoch: 200
  batch_size: 24
  learning_rate: 0.001
  decay_rate: 0.0001
  optimizer: Adam
  scheduler_step: 20
  scheduler_gamma: 0.7
  seed: 42
  num_workers: 4

output_dir: outputs/original_pdans_x4_pointnet2
log_dir: logs/original_pdans_x4_pointnet2
reports_dir: reports/original_pdans_x4_pointnet2

# Comparison reference (main Line A baseline):
#   original_baseline: native 1024, best acc = 91.95%
